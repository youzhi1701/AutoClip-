name: Import AutoClip upstream

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Import upstream source snapshot
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/zhouxiaoka/autoclip.git /tmp/autoclip
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github/workflows' \
            /tmp/autoclip/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to import."
            exit 0
          fi
          git commit -m "chore: import AutoClip upstream source"
          git push origin HEAD:main
